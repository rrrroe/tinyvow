<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Vow S07 · 产品特性总览 v1</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; }

      body {
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: #263a35;
        background: #f7f3ec;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        isolation: isolate;
      }

      .background {
        position: absolute;
        inset: 0;
        z-index: -10;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .wash {
        position: absolute;
        z-index: -8;
        inset: 0;
        background:
          radial-gradient(circle at 18% 35%, rgba(100, 207, 168, 0.19), transparent 32%),
          radial-gradient(circle at 83% 38%, rgba(111, 164, 229, 0.19), transparent 32%),
          radial-gradient(circle at 52% 80%, rgba(242, 177, 68, 0.15), transparent 42%);
      }

      .header {
        position: absolute;
        z-index: 30;
        top: 46px;
        left: 34px;
        right: 34px;
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #203b33;
        font-size: 74px;
        line-height: 1.08;
        font-weight: 840;
        letter-spacing: -4px;
        white-space: nowrap;
      }

      .subtitle {
        margin-top: 18px;
        color: #667a72;
        font-size: 33px;
        line-height: 1.42;
        font-weight: 620;
      }

      .feature {
        position: absolute;
        overflow: hidden;
        border-radius: 46px;
        border: 1px solid rgba(255,255,255,0.82);
        background: rgba(255,255,255,0.78);
        box-shadow:
          0 28px 58px rgba(53, 72, 64, 0.14),
          0 8px 20px rgba(53, 72, 64, 0.06),
          inset 0 1px 0 rgba(255,255,255,0.96);
      }

      .feature-title {
        margin: 0;
        color: #29473e;
        font-size: 43px;
        line-height: 1.12;
        font-weight: 830;
        letter-spacing: -1px;
      }

      .feature-copy {
        margin: 17px 0 0;
        color: #61746d;
        font-size: 29px;
        line-height: 1.48;
        font-weight: 590;
      }

      .local-card {
        z-index: 8;
        top: 290px;
        left: 38px;
        width: 648px;
        height: 500px;
        padding: 60px 48px 42px 326px;
        background: linear-gradient(145deg, rgba(245,255,251,0.96), rgba(218,246,234,0.88));
        transform: rotate(-0.7deg);
      }

      .local-art {
        position: absolute;
        left: 42px;
        top: 62px;
        width: 246px;
        height: 330px;
      }

      .local-phone {
        position: absolute;
        left: 30px;
        top: 8px;
        width: 188px;
        height: 296px;
        border: 10px solid #3a7563;
        border-radius: 42px;
        background: linear-gradient(160deg, #ffffff, #dff6ed);
        box-shadow: 0 24px 44px rgba(54, 117, 95, 0.18), inset 0 0 0 6px rgba(255,255,255,0.72);
      }

      .local-phone::before {
        content: "";
        position: absolute;
        top: 16px;
        left: 50%;
        width: 54px;
        height: 7px;
        border-radius: 99px;
        background: rgba(58,117,99,0.34);
        transform: translateX(-50%);
      }

      .database {
        position: absolute;
        left: 61px;
        top: 78px;
        width: 126px;
        height: 132px;
      }

      .db-layer {
        position: absolute;
        left: 0;
        width: 126px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(180deg, #83d8ba, #4bb38e);
        border: 4px solid rgba(255,255,255,0.84);
        box-shadow: 0 7px 12px rgba(51,112,91,0.15);
      }

      .db-1 { top: 0; }
      .db-2 { top: 35px; }
      .db-3 { top: 70px; }

      .local-dot {
        position: absolute;
        border-radius: 50%;
        background: #67cba8;
        box-shadow: 0 6px 12px rgba(70,143,117,0.18);
      }

      .ld-1 { width: 18px; height: 18px; left: 2px; top: 65px; }
      .ld-2 { width: 12px; height: 12px; right: 0; top: 126px; }
      .ld-3 { width: 15px; height: 15px; left: 10px; bottom: 35px; }

      .chips {
        display: flex;
        gap: 11px;
        margin-top: 26px;
        flex-wrap: wrap;
      }

      .chip {
        padding: 10px 17px 12px;
        border-radius: 999px;
        color: #316a58;
        background: rgba(255,255,255,0.76);
        border: 1px solid rgba(66,146,116,0.15);
        font-size: 25px;
        line-height: 1;
        font-weight: 740;
      }

      .super-card {
        z-index: 10;
        top: 320px;
        right: 38px;
        width: 388px;
        height: 460px;
        padding: 248px 37px 34px;
        text-align: center;
        background: linear-gradient(145deg, rgba(251,253,255,0.97), rgba(222,235,251,0.90));
        transform: rotate(1.1deg);
      }

      .lock-art {
        position: absolute;
        left: 87px;
        top: 36px;
        width: 214px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.98), rgba(199,223,249,0.78));
        box-shadow: 0 22px 42px rgba(71,117,171,0.16), inset 0 0 0 12px rgba(255,255,255,0.48);
      }

      .lock-shackle {
        position: absolute;
        left: 61px;
        top: 35px;
        width: 92px;
        height: 94px;
        border: 14px solid #487bae;
        border-bottom: 0;
        border-radius: 52px 52px 0 0;
      }

      .lock-body {
        position: absolute;
        left: 46px;
        top: 102px;
        width: 122px;
        height: 80px;
        border-radius: 25px;
        background: linear-gradient(145deg, #6fa8df, #4079ad);
        box-shadow: 0 14px 24px rgba(55,100,143,0.22);
      }

      .lock-body::after {
        content: "";
        position: absolute;
        left: 53px;
        top: 23px;
        width: 16px;
        height: 31px;
        border-radius: 10px;
        background: #eef7ff;
      }

      .time-window {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px 12px;
        border-radius: 999px;
        color: #3f6f9d;
        background: rgba(255,255,255,0.78);
        font-size: 27px;
        line-height: 1;
        font-weight: 770;
      }

      .theme-card {
        z-index: 12;
        top: 820px;
        left: 78px;
        width: 924px;
        height: 355px;
        padding: 47px 52px 34px;
        background: linear-gradient(110deg, rgba(255,247,243,0.95), rgba(243,250,246,0.94) 48%, rgba(239,245,255,0.94));
        transform: rotate(-0.65deg);
      }

      .theme-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .theme-top .feature-copy { max-width: 560px; }

      .custom-mark {
        margin-top: 7px;
        padding: 10px 18px 12px;
        border-radius: 999px;
        background: linear-gradient(90deg, #f2a28d, #77cda9, #78a7dd);
        color: white;
        font-size: 26px;
        line-height: 1;
        font-weight: 770;
        box-shadow: 0 9px 18px rgba(79,111,100,0.13);
      }

      .theme-row {
        display: flex;
        align-items: center;
        gap: 32px;
        margin-top: 33px;
      }

      .theme-swatch {
        position: relative;
        width: 82px;
        height: 82px;
        border-radius: 28px;
        background: var(--swatch);
        box-shadow: 0 15px 26px rgba(54,73,66,0.15), inset 0 0 0 5px rgba(255,255,255,0.75);
        transform: rotate(var(--tilt));
      }

      .theme-swatch::after {
        content: "";
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgba(255,255,255,0.82);
      }

      .bottom-card {
        z-index: 9;
        top: 1220px;
        width: 320px;
        height: 500px;
        padding: 248px 34px 34px;
        text-align: center;
      }

      .bottom-card .feature-title { font-size: 39px; }
      .bottom-card .feature-copy { font-size: 27px; }

      .text-card {
        left: 38px;
        background: linear-gradient(145deg, rgba(251,252,255,0.96), rgba(228,235,250,0.90));
        transform: rotate(-1deg);
      }

      .language-card {
        left: 380px;
        top: 1250px;
        background: linear-gradient(145deg, rgba(250,255,252,0.96), rgba(220,246,235,0.90));
        transform: rotate(0.8deg);
      }

      .backup-card {
        z-index: 9;
        top: 1220px;
        left: 90px;
        width: 900px;
        height: 500px;
        padding: 94px 58px 50px 430px;
        background: linear-gradient(145deg, rgba(255,252,247,0.96), rgba(251,229,191,0.90));
        transform: rotate(-0.5deg);
      }

      .backup-card .feature-title { font-size: 48px; }
      .backup-card .feature-copy { font-size: 31px; }

      .text-art,
      .language-art,
      .backup-art {
        position: absolute;
        left: 48px;
        top: 40px;
        width: 224px;
        height: 180px;
      }

      .text-art {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 13px;
        color: #526f9e;
        font-weight: 850;
      }

      .a-small { font-size: 46px; }
      .a-medium { font-size: 72px; }
      .a-large { font-size: 112px; line-height: 0.9; }

      .size-dots {
        position: absolute;
        left: 38px;
        right: 38px;
        bottom: 2px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .size-dots i {
        display: block;
        border-radius: 50%;
        background: #7594c1;
      }

      .size-dots i:nth-child(1) { width: 10px; height: 10px; }
      .size-dots i:nth-child(2) { width: 14px; height: 14px; }
      .size-dots i:nth-child(3) { width: 18px; height: 18px; }
      .size-dots i:nth-child(4) { width: 23px; height: 23px; }

      .language-art span {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        color: white;
        font-weight: 830;
        box-shadow: 0 16px 28px rgba(56,104,88,0.16);
      }

      .lang-cn { left: 3px; top: 12px; background: linear-gradient(145deg, #65caa6, #3ea17f); font-size: 61px; }
      .lang-en { right: 1px; bottom: 5px; background: linear-gradient(145deg, #7ba9dd, #557fab); font-size: 38px; }

      .backup-art {
        left: 92px;
        top: 78px;
        width: 270px;
        height: 270px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.94), rgba(244,202,125,0.60));
      }

      .file-shape {
        position: absolute;
        left: 82px;
        top: 52px;
        width: 106px;
        height: 132px;
        border-radius: 16px;
        background: linear-gradient(145deg, #f7bf59, #d9912b);
        box-shadow: 0 14px 25px rgba(177,112,28,0.19);
      }

      .file-shape::before,
      .file-shape::after {
        content: "";
        position: absolute;
        left: 20px;
        right: 20px;
        height: 7px;
        border-radius: 99px;
        background: rgba(255,255,255,0.76);
      }

      .file-shape::before { top: 42px; }
      .file-shape::after { top: 65px; }

      .backup-arrow {
        position: absolute;
        left: 47px;
        top: 18px;
        width: 176px;
        height: 176px;
        border: 10px solid #e8a53c;
        border-left-color: transparent;
        border-radius: 50%;
        transform: rotate(-34deg);
      }

      .backup-arrow::after {
        content: "";
        position: absolute;
        right: -3px;
        top: 3px;
        width: 0;
        height: 0;
        border-left: 18px solid #e8a53c;
        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        transform: rotate(30deg);
      }

      .backup-actions {
        display: flex;
        gap: 12px;
        margin-top: 31px;
        flex-wrap: wrap;
      }

      .backup-actions span {
        padding: 11px 18px 13px;
        border-radius: 999px;
        color: #8b5b19;
        background: rgba(255,255,255,0.72);
        border: 1px solid rgba(188,127,42,0.16);
        font-size: 26px;
        line-height: 1;
        font-weight: 740;
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <img class="background" src="../generated/bg-paper-olive-portrait-v1.png" alt="" />
      <div class="wash"></div>

      <header class="header">
        <h1>功能丰富，边界也清楚</h1>
        <div class="subtitle">本地记录、规则保护与个性化设置，都由你决定。</div>
      </header>

      <section class="feature local-card" aria-label="核心记录留在本机">
        <div class="local-art" aria-hidden="true">
          <div class="local-phone"></div>
          <div class="database">
            <div class="db-layer db-1"></div>
            <div class="db-layer db-2"></div>
            <div class="db-layer db-3"></div>
          </div>
          <i class="local-dot ld-1"></i><i class="local-dot ld-2"></i><i class="local-dot ld-3"></i>
        </div>
        <h2 class="feature-title">核心记录<br />留在本机</h2>
        <p class="feature-copy">约定、专注与使用历史默认不上传。</p>
        <div class="chips"><span class="chip">本地优先</span><span class="chip">隐私可控</span></div>
      </section>

      <section class="feature super-card" aria-label="超我模式">
        <div class="lock-art" aria-hidden="true">
          <div class="lock-shackle"></div><div class="lock-body"></div>
        </div>
        <h2 class="feature-title">超我模式</h2>
        <p class="feature-copy">本机密码保护关键修改。</p>
        <div class="time-window">06:00–10:00</div>
      </section>

      <section class="feature theme-card" aria-label="多样及自定义主题">
        <div class="theme-top">
          <div>
            <h2 class="feature-title">多样主题，也能自己配色</h2>
            <p class="feature-copy">预设主题之外，还能自定义三种主色。</p>
          </div>
          <div class="custom-mark">自定义三色</div>
        </div>
        <div class="theme-row" aria-hidden="true">
          <div class="theme-swatch" style="--swatch:linear-gradient(145deg,#6cc9aa,#dff5ec);--tilt:-6deg"></div>
          <div class="theme-swatch" style="--swatch:linear-gradient(145deg,#74a8df,#e3eefb);--tilt:3deg"></div>
          <div class="theme-swatch" style="--swatch:linear-gradient(145deg,#ee9c86,#fde6dd);--tilt:-2deg"></div>
          <div class="theme-swatch" style="--swatch:linear-gradient(145deg,#bc93d9,#f0e5f7);--tilt:5deg"></div>
          <div class="theme-swatch" style="--swatch:linear-gradient(145deg,#e4ae45,#fbefd0);--tilt:-4deg"></div>
          <div class="theme-swatch" style="--swatch:linear-gradient(145deg,#477266,#d8e8e2);--tilt:2deg"></div>
          <div class="theme-swatch" style="--swatch:linear-gradient(145deg,#6a879e,#e2eaf0);--tilt:-5deg"></div>
        </div>
      </section>

      <section class="feature backup-card" aria-label="本地备份恢复和清理">
        <div class="backup-art" aria-hidden="true"><div class="file-shape"></div><div class="backup-arrow"></div></div>
        <h2 class="feature-title">备份、恢复、清理</h2>
        <p class="feature-copy">数据去留，始终由你掌握。</p>
        <div class="backup-actions"><span>导出备份</span><span>恢复数据</span><span>清理本地</span></div>
      </section>
    </main>
  </body>
</html>
