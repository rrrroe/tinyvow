<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Vow S01 · Approved v6</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
      }

      body {
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: #263a35;
        background: #f7f3ec;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f7f3ec;
      }

      .background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .header {
        position: absolute;
        z-index: 3;
        left: 64px;
        right: 64px;
        top: 48px;
      }

      h1 {
        margin: 0;
        color: #203b33;
        font-size: 88px;
        line-height: 1.08;
        font-weight: 790;
        letter-spacing: -4px;
      }

      .subtitle {
        margin-top: 18px;
        color: #667a72;
        font-size: 36px;
        line-height: 1.38;
        font-weight: 540;
        letter-spacing: 0.2px;
      }

      .device-screen {
        position: absolute;
        z-index: 2;
        left: 40px;
        top: 304px;
        width: 688px;
        height: 1455px;
        overflow: hidden;
        border: 1px solid rgba(56, 82, 72, 0.15);
        border-radius: 42px;
        background: #f4f8fb;
        box-shadow:
          0 50px 96px rgba(61, 76, 68, 0.2),
          0 14px 34px rgba(61, 76, 68, 0.11);
      }

      .device-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.72);
        pointer-events: none;
      }

      .app-shot {
        position: absolute;
        left: 0;
        top: -74px;
        display: block;
        width: 688px;
        height: auto;
      }

      .tag-stack {
        position: absolute;
        z-index: 4;
        right: 40px;
        top: 304px;
        width: 292px;
        height: 1455px;
        display: grid;
        grid-template-rows: repeat(3, 1fr);
        gap: 24px;
      }

      .tag-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 34px 22px 30px 30px;
        overflow: hidden;
        border: 1px solid rgba(61, 79, 72, 0.12);
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow:
          0 22px 44px rgba(62, 77, 69, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.98);
      }

      .tag-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 10px;
      }

      .tag-card.control::before { background: #f27c7f; }
      .tag-card.encourage::before { background: #68d1a6; }
      .tag-card.focus::before { background: #7daee0; }

      .tag-symbol {
        min-width: 150px;
        height: 92px;
        display: grid;
        place-items: center;
        padding: 0 24px;
        border-radius: 30px;
        font-size: 43px;
        line-height: 1;
        font-weight: 800;
      }

      .control .tag-symbol { color: #d45e62; background: #fff0ef; }
      .encourage .tag-symbol { color: #369f76; background: #eaf9f2; }
      .focus .tag-symbol { color: #568ac1; background: #edf5ff; }

      .tag-title {
        margin-top: 26px;
        color: #284239;
        font-size: 46px;
        line-height: 1.18;
        font-weight: 790;
        text-align: center;
        letter-spacing: -1px;
      }

      .tag-meta {
        margin-top: 28px;
        color: #64756e;
        font-size: 34px;
        line-height: 1.4;
        font-weight: 680;
        text-align: center;
        letter-spacing: 0.3px;
      }

      .tag-note {
        margin-top: 14px;
        color: #829089;
        font-size: 29px;
        line-height: 1.3;
        font-weight: 580;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <img class="background" src="../generated/bg-paper-olive-portrait-v1.png" alt="" />

      <header class="header">
        <h1>和手机好好相处</h1>
        <div class="subtitle">约定少一点，投入多一点，专注也被看见。</div>
      </header>

      <section class="device-screen" aria-label="去除状态栏后的 Tiny Vow 首页完整真机界面">
        <img
          class="app-shot"
          src="../screenshots/raw/zh-CN/S01_home_overview_zh-CN.png"
          alt="Tiny Vow 首页真机截图"
        />
      </section>

      <section class="tag-stack" aria-label="约定、投入、专注标签">
        <article class="tag-card control">
          <span class="tag-symbol">约定</span>
          <span class="tag-title">温和限额</span>
          <span class="tag-meta">日 · 周 · 月</span>
          <span class="tag-note">到点提醒</span>
        </article>

        <article class="tag-card encourage">
          <span class="tag-symbol">投入</span>
          <span class="tag-title">正向积累</span>
          <span class="tag-meta">时长 · 积分</span>
          <span class="tag-note">投入有回声</span>
        </article>

        <article class="tag-card focus">
          <span class="tag-symbol">专注</span>
          <span class="tag-title">离线专注</span>
          <span class="tag-meta">固定 · 自由</span>
          <span class="tag-note">记录屏幕外</span>
        </article>
      </section>
    </main>
  </body>
</html>
