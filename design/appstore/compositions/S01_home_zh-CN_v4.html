<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Vow S01 · Mobile-readable v4</title>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
      }

      body {
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: #263a35;
        background: #f7f3ec;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f7f3ec;
      }

      .background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .header {
        position: absolute;
        z-index: 3;
        left: 70px;
        right: 70px;
        top: 50px;
      }

      .product-label {
        display: flex;
        align-items: baseline;
        gap: 18px;
        color: #3f5d53;
      }

      .product-label strong {
        font-size: 30px;
        line-height: 1;
        font-weight: 760;
        letter-spacing: 1px;
      }

      .product-label span {
        font-size: 22px;
        line-height: 1;
        font-weight: 720;
        letter-spacing: 3.8px;
        opacity: 0.7;
      }

      h1 {
        margin: 24px 0 0;
        color: #203b33;
        font-size: 82px;
        line-height: 1.08;
        font-weight: 780;
        letter-spacing: -3px;
      }

      .subtitle {
        margin-top: 14px;
        color: #667a72;
        font-size: 34px;
        line-height: 1.42;
        font-weight: 520;
        letter-spacing: 0.2px;
      }

      .app-window {
        position: absolute;
        z-index: 2;
        left: 90px;
        top: 330px;
        width: 900px;
        height: 930px;
        overflow: hidden;
        border: 1px solid rgba(56, 82, 72, 0.14);
        border-radius: 48px;
        background: #f4f8fb;
        box-shadow:
          0 42px 86px rgba(61, 76, 68, 0.17),
          0 12px 28px rgba(61, 76, 68, 0.09);
      }

      .app-window::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.72);
        pointer-events: none;
      }

      .app-shot {
        position: absolute;
        left: 0;
        top: -115px;
        width: 900px;
        height: auto;
        display: block;
      }

      .section-title {
        position: absolute;
        z-index: 4;
        left: 70px;
        top: 1292px;
        color: #263a35;
        font-size: 40px;
        line-height: 1.2;
        font-weight: 780;
        letter-spacing: -1px;
      }

      .feature-list {
        position: absolute;
        z-index: 4;
        left: 62px;
        right: 62px;
        top: 1360px;
        display: grid;
        gap: 14px;
      }

      .feature-row {
        position: relative;
        height: 142px;
        display: grid;
        grid-template-columns: 100px 1fr;
        align-items: center;
        padding: 0 32px 0 24px;
        overflow: hidden;
        border: 1px solid rgba(61, 79, 72, 0.11);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow:
          0 16px 34px rgba(62, 77, 69, 0.09),
          inset 0 1px 0 rgba(255, 255, 255, 0.96);
      }

      .feature-row::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 8px;
      }

      .feature-row.control::before { background: #f27c7f; }
      .feature-row.encourage::before { background: #68d1a6; }
      .feature-row.focus::before { background: #7daee0; }

      .feature-icon {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        font-size: 34px;
        line-height: 1;
        font-weight: 800;
      }

      .control .feature-icon { color: #d45e62; background: #fff0ef; }
      .encourage .feature-icon { color: #369f76; background: #eaf9f2; }
      .focus .feature-icon { color: #568ac1; background: #edf5ff; }

      .feature-copy {
        min-width: 0;
      }

      .feature-copy h2 {
        display: inline;
        margin: 0;
        color: #284239;
        font-size: 43px;
        line-height: 1.12;
        font-weight: 780;
        letter-spacing: -1px;
      }

      .feature-copy p {
        margin: 7px 0 0;
        color: #64756e;
        font-size: 34px;
        line-height: 1.35;
        font-weight: 530;
        white-space: nowrap;
      }

      .footer {
        position: absolute;
        z-index: 4;
        left: 70px;
        right: 70px;
        bottom: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #596f66;
        font-size: 23px;
        line-height: 1;
        font-weight: 660;
        letter-spacing: 0.8px;
      }

      .footer strong {
        color: #3f5d53;
        font-weight: 760;
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <img class="background" src="../generated/bg-paper-olive-portrait-v1.png" alt="" />

      <header class="header">
        <div class="product-label">
          <strong>小约定</strong>
          <span>TINY VOW</span>
        </div>
        <h1>和手机好好相处</h1>
        <div class="subtitle">少一点无意识，多一点真正投入。</div>
      </header>

      <section class="app-window" aria-label="Tiny Vow 首页真实界面">
        <img
          class="app-shot"
          src="../screenshots/raw/zh-CN/S01_home_overview_zh-CN.png"
          alt="Tiny Vow 首页今日总览"
        />
      </section>

      <div class="section-title">约定、投入、专注，三种方式一起改变</div>

      <section class="feature-list" aria-label="核心功能说明">
        <article class="feature-row control">
          <div class="feature-icon">约</div>
          <div class="feature-copy">
            <h2>约定</h2>
            <p>给容易刷久的 App 设日、周、月限额</p>
          </div>
        </article>

        <article class="feature-row encourage">
          <div class="feature-icon">投</div>
          <div class="feature-copy">
            <h2>投入</h2>
            <p>阅读、学习、运动都能积累 PT</p>
          </div>
        </article>

        <article class="feature-row focus">
          <div class="feature-icon">专</div>
          <div class="feature-copy">
            <h2>专注</h2>
            <p>固定或自由计时，记录屏幕外的努力</p>
          </div>
        </article>
      </section>

      <footer class="footer">
        <strong>本地优先 · 使用记录默认留在设备</strong>
        <span>揉揉喽出品 · BY ROROLO</span>
      </footer>
    </main>
  </body>
</html>
