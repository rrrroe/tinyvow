<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Vow S05 · Phone usage insights v3</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; }

      body {
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: #263a35;
        background: #f7f3ec;
      }

      .poster {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        isolation: isolate;
        background: #f7f3ec;
      }

      .background {
        position: absolute;
        inset: 0;
        z-index: -5;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .data-orbit {
        position: absolute;
        z-index: -3;
        top: 220px;
        left: 180px;
        width: 880px;
        height: 880px;
        border: 2px solid rgba(125, 174, 224, 0.19);
        border-radius: 50%;
        box-shadow:
          0 0 0 50px rgba(125, 174, 224, 0.032),
          0 0 0 100px rgba(104, 209, 166, 0.022);
      }

      .header {
        position: absolute;
        z-index: 20;
        top: 40px;
        left: 34px;
        right: 34px;
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #203b33;
        font-size: 74px;
        line-height: 1.08;
        font-weight: 830;
        letter-spacing: -4px;
        white-space: nowrap;
      }

      .subtitle {
        margin-top: 17px;
        color: #667a72;
        font-size: 33px;
        line-height: 1.42;
        font-weight: 600;
      }

      .report-card {
        position: absolute;
        overflow: hidden;
        border: 0;
        border-radius: 32px;
        background: #f4f8fb;
        box-shadow:
          0 22px 48px rgba(55, 73, 65, 0.15),
          0 6px 16px rgba(55, 73, 65, 0.07);
        transform-origin: center center;
      }

      .key-card {
        z-index: 2;
        top: 280px;
        left: 22px;
        width: 600px;
        height: 555px;
        transform: rotate(-0.55deg);
      }

      .scatter-card {
        z-index: 6;
        top: 300px;
        left: 438px;
        width: 620px;
        height: 540px;
        transform: rotate(0.55deg);
      }

      .points-card {
        z-index: 5;
        top: 850px;
        left: 22px;
        width: 620px;
        height: 520px;
        transform: rotate(-0.5deg);
      }

      .daily-trace-card {
        z-index: 8;
        top: 870px;
        left: 438px;
        width: 620px;
        height: 520px;
        transform: rotate(0.5deg);
      }

      .weekly-trace-card {
        z-index: 12;
        top: 1390px;
        left: 120px;
        width: 840px;
        height: 450px;
        transform: rotate(-0.25deg);
      }

      .key-shot,
      .scatter-shot,
      .points-shot,
      .daily-trace-shot,
      .weekly-trace-shot {
        position: absolute;
        display: block;
        height: auto;
      }

      .key-shot {
        top: -155px;
        left: -21px;
        width: 648px;
      }

      .scatter-shot {
        top: -145px;
        left: -22px;
        width: 663px;
      }

      .points-shot {
        top: -263px;
        left: -22px;
        width: 663px;
      }

      .daily-trace-shot {
        top: -795px;
        left: -22px;
        width: 663px;
      }

      .weekly-trace-shot {
        top: -545px;
        left: -29px;
        width: 899px;
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <img class="background" src="../generated/bg-paper-olive-portrait-v1.png" alt="" />
      <div class="data-orbit" aria-hidden="true"></div>

      <header class="header">
        <h1>See how every day unfolds</h1>
        <div class="subtitle">Daily detail, weekly rhythm, and points over time.</div>
      </header>

      <section class="report-card key-card" aria-label="Key data">
        <img class="key-shot" src="../screenshots/raw/en/S06_daily_report_en.png" alt="Key data" />
      </section>

      <section class="report-card scatter-card" aria-label="Weekly behavior scatter plot without the category grid">
        <img class="scatter-shot" src="../screenshots/raw/en/S06_weekly_behavior_scatter_en.png" alt="Weekly behavior scatter plot" />
      </section>

      <section class="report-card points-card" aria-label="Weekly points journey">
        <img class="points-shot" src="../screenshots/raw/en/S06_weekly_points_trajectory_en.png" alt="Weekly points journey" />
      </section>

      <section class="report-card daily-trace-card" aria-label="Friday daily time trace">
        <img class="daily-trace-shot" src="../screenshots/edited/en/S06_daily_time_trace_friday_en_localized.png" alt="Friday daily time trace" />
      </section>

      <section class="report-card weekly-trace-card" aria-label="Weekly time trace">
        <img class="weekly-trace-shot" src="../screenshots/raw/en/S06_weekly_time_trace_en.png" alt="Weekly time trace" />
      </section>
    </main>
  </body>
</html>
